# Run: swiftlint (installed from the GitHub release binary; Homebrew can't build it on Xcode 15)
included:
  - Sources
  - Tests
excluded:
  - .build
  - build

opt_in_rules:
  - force_unwrapping
  - weak_delegate
  - unused_closure_parameter

disabled_rules:
  - trailing_comma # Package.swift and literals use trailing commas

force_try: error
force_cast: error

# Long user-facing strings (permission and status messages) live inline.
line_length:
  warning: 200
  error: 250

identifier_name:
  excluded: [t, sr, id]
